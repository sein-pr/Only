version: '3.8'

services:
  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Flask Application
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=sk_dev_a8f5f167f44f4964e6c998dee827110c
      - FLASK_ENV=production
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=True
      - MAIL_USERNAME=${MAIL_USERNAME:-fromisgood@gmail.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-deui rrwc wdlr rrdc}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-fromisgood@gmail.com}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_51SBGRFA3Xw82lRlh6xutx1p9SqHtp4ilApW5IJox6Repd53kAxRoMNELJDKlrhEe0YaQUpX3de0YN1BBoONTrSij00uymkBE0k}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_51SBGRFA3Xw82lRlh0RJIc9S7s3VL0DzsOhrpMohObh33C5VHjnYeMcRyqh8htK3ZS3Po1gF2sHiXx6C7SJNiQFql00qYiolhN6}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./instance:/app/instance  # Mount instance folder for SQLite database
    restart: unless-stopped

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static/uploads:/var/www/uploads:ro
    depends_on:
      - web
    restart: unless-stopped

